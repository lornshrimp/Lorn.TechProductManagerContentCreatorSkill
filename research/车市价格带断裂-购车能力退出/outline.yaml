topic: 中国车市价格带断裂与中低收入购车能力退出
subtitle: 验证"车市销量下降+高价车销量上升=贫富分化加剧的先验信号"这一判断
created: 2026-09-13
time_range: 2024-01-01 至今

# 调研定位
positioning: |
  本调研不按"对象"划分条目，而按【证据节点】划分——每一项都是一个需要独立核验的论点支撑。
  核心命题：车市价格带断裂属"底部塌陷型分化"（购买力从中低收入群体整体退出），
  而非"消费升级"（同一批人往上迁移）。需证明三件事：
    ① 总量确实大幅萎缩
    ② 降幅确实集中于底部
    ③ 底部退出是【支付能力】问题而非偏好问题
  三项均需可核验的独立数据，不得依赖单一来源。

# 核心判别框架（作者四判据，贯穿全部条目）
criteria:
  - 总量守恒检验: 总量守恒+低端萎缩=升级；总量大幅萎缩+降幅集中于底部=分化
  - 先验指标vs后验指标: 预警型数据价值在提前量，不用后验的尺子量先验的数据
  - 分子分母拆解: "占比上升"必须反算净变动绝对量，区分分子增长与分母萎缩
  - 政策累退性检验: 同额补贴占车价比重的差异（补贴/车价比值）

# 分组结构（五组证据链，含一组专门用于防自证偏差）
groups:
  A: 消费端（需求侧硬数据）
  B: 供给端（退出证据）
  C: 政策端（累退性证据）
  D: 就业收入端（先验指标）
  E: 对照与反证（防自证偏差）—— 前四组为结论找证据，本组专门找反例

items:
  # ===== A 消费端（8 项）=====
  - id: A1
    name: 分价格带销量与同比完整序列
    group: A
    origin: step1
    priority: P0
    note: 需覆盖 2024 全年 / 2025 全年 / 2026Q1 / 2026H1，避免只有单季点状数据被误读为趋势
  - id: A2
    name: 入门级细分表现（A00/A0 级、5 万元以下）含车型 SKU 数量
    group: A
    origin: step1
    priority: P0
    note: 销量降幅 + 在售车型款数双重证据，证明"需求被供给端强制出清"
  - id: A3
    name: 首购 vs 换购/增购比例变化
    group: A
    origin: step2
    priority: P0
    note: 【结构性遗漏，最高价值】首购群体萎缩是"支付能力退出"最直接证据，比价格带更硬。2026 出现"首购驱动→置换驱动"切换、40万+ 用户置换占比 78%
  - id: A4
    name: 二手车承接与车龄结构（含新能源/燃油二手车分化）
    group: A
    origin: step1
    priority: P1
    note: 二手车交易量首次追平新车；需判断是"降级承接"还是"消费升级后的置换外溢"
  - id: A5
    name: 汽车金融渗透率与贷款结构 + 杠杆化异常信号
    group: A
    origin: step1+step2
    priority: P0
    note: 【关键判别点】2026 年 20+ 品牌推"7 年超长贷/0 首付"；需辨别"支付能力下降被杠杆掩盖"与"支付能力提升"。汽金公司口径渗透率 2023 年 29%→2024 年 23%
  - id: A6
    name: 成交均价 vs 指导价、终端折扣与价格倒挂深度
    group: A
    origin: step1
    priority: P1
    note: 需补倒挂率（82%）、倒挂幅度（51.6% > 15%）等渠道侧数据
  - id: A7
    name: 乘用车均价"倒U曲线"拐点
    group: A
    origin: step2
    priority: P1
    note: 2019-2024 均价 15.1→18.4 万六年连涨终结，2025 降至 17.0 万。总量价格信号，独立于结构
  - id: A8
    name: 城市线级购车预算差距与县域市场表现
    group: A
    origin: step2
    priority: P0
    note: 【结构分解关键】高线-低线城市购车预算差从 3-5 万扩大到约 7 万；县域 5-8 万燃油/微型电动车需求萎缩最重，中西部承压最深

  # ===== B 供给端（5 项）=====
  - id: B1
    name: 停产/退市入门车型清单（2024-2026）
    group: B
    origin: step1
    priority: P1
    note: A 级/福克斯/马自达6/飞度/Polo/桑塔纳等经典燃油车型离场
  - id: B2
    name: 车企低端产品线收缩动作 + 车型 SKU 供给收缩
    group: B
    origin: step1+step2
    priority: P1
    note: 微型车在售一度约 50 款→大量撤展；车型可得性下降=需求被供给端强制出清
  - id: B3
    name: 低端产能退出与 4S 店退网数量
    group: B
    origin: step1
    priority: P1
    note: 2026H1 超 1800 家退网（日均约 10 家，同比 +近三成）；燃油 4S 店 3.2 万（峰值 3.5 万）
  - id: B4
    name: 汽车行业利润率
    group: B
    origin: step2
    priority: P1
    note: 整车制造环节利润率 2026H1 跌至 1.5%（近十年低位），行业整体 3.8%→2026年1-7月 3.6%（利润 -20%）。"退出"的财务铁证
  - id: B5
    name: 经销商渠道结构性出清细化
    group: B
    origin: step2
    priority: P2
    note: 盈利面 23.5%、亏损面 55.7%、82% 价格倒挂

  # ===== C 政策端（5 项）=====
  - id: C1
    name: 以旧换新 2026 官方规则文本 + 2025 分档对照表
    group: C
    origin: step1
    priority: P0
    note: 【已锁定文号】发改环资〔2025〕1745号；商办消费函2025年第467号 / 商消费函〔2025〕697号（商务部等8部门《2026年汽车以旧换新补贴实施细则》）。2025 置换分档：5万以下 5000元 / 5-10万 8000-10000元 / 10-20万 10000-12000元 / 20万以上 13000-15000元 → 2026 改按比例
  - id: C2
    name: 新能源购置税退坡时间表与幅度 + 车船税退坡
    group: C
    origin: step1
    priority: P0
    note: 财政部税务总局工信部公告2023年第10号（减半征收）；车船税：2026年第19号公告，2027.1.1 起取消节能车减半、新能源商用车免征
  - id: C3
    name: 政策前置需求测算（约 300 万辆）方法与出处
    group: C
    origin: step1
    priority: P0
    note: 金融街证券张一/何修桐测算约 300 万辆；国泰君安测算电车透支 120-150 万辆。需获取测算方法而非仅结论
  - id: C4
    name: 政策累退性系数逐档测算（补贴金额/车价比值）
    group: C
    origin: step2
    priority: P0
    note: 【核心自建测算】逐档计算"补贴/车价"比值，把"累退性"从定性判断变成可计算数字。示例：3 万元车报废补贴 2万→3600元，缩水 82%
  - id: C5
    name: 补贴"限额投放"机制
    group: C
    origin: step2
    priority: P2
    note: 2026 多地按月限额、当月用完即止（江西等）。额度约束本身即需求压制装置
  - id: C6
    name: PHEV 购置税减免技术门槛变化
    group: C
    origin: step2
    priority: P2
    note: 2026 年起纯电续航门槛 43km→100km，短续航插混失去红利。政策累退性的新维度（目录门槛，非仅补贴）

  # ===== D 就业收入端（6 项）=====
  - id: D1
    name: 灵活就业规模与统计口径
    group: D
    origin: step1
    priority: P0
    note: 官方人社部超 2 亿（占就业 27.6%）；机构宽口径 2026 预测 3.2 亿（占 7.25 亿总就业 44%）；年增约 4000 万；新就业形态劳动者 8400 万子口径。须注明口径差异
  - id: D2
    name: 社保参保率（养老/工伤/覆盖）
    group: D
    origin: step1
    priority: P0
    note: 职工养老保险实际参保率约 29.5%；工伤保险 12.8%；23.6% 未参加任何社保
  - id: D3
    name: 居民可支配收入与中位数增速（五等份分组 + 连续年份倍数序列）
    group: D
    origin: step1+step2
    priority: P0
    note: 2025 高收入组 103778 元 vs 低收入组 10150 元（约 10.2 倍）；2026H1 中位数 19036 元/+4.7%，为平均数 82.8%。需连续年份倍数序列
  - id: D4
    name: 35+ 就业状况（官方口径 + 坊间口径辨析 + 再就业周期）
    group: D
    origin: step1
    priority: P0
    note: 官方无"35+ 失业率"分档（仅 16-24/25-29/30-59）；坊间 21.3% 口径不透明须标注；智联招聘 2025 年 35+ 求职周期 6.2 个月（比 2023 多近 2 个月）
  - id: D5
    name: 汽车类社会消费品零售总额与消费倾向
    group: D
    origin: step1
    priority: P1
  - id: D6
    name: 财产性收入塌陷与中位数/平均数背离
    group: D
    origin: step2
    priority: P1
    note: 2026H1 人均财产净收入仅 +1.1%（工资性 +5.3%、经营净 +6.5%）。财产性收入靠高收入群体，其塌陷与高端车韧性形成张力，需辨析

  # ===== E 对照与反证（6 项）=====
  - id: E1
    name: 40万+ 换庄证据（新能源 vs 燃油；换购来源品牌链）
    group: E
    origin: step1+step2
    priority: P0
    note: 40万+ 新能源 +46% vs 传统燃油 -27%；40万+ 自主份额 59%（传统豪华 92%→38%）；蔚来 ES8 换购占 50.3%、其中 41.7% 来自传统豪华；头部自主豪华 80% 换购来自 BBA/路虎/保时捷
  - id: E2
    name: BBA/传统豪华在华表现（量+价+份额）
    group: E
    origin: step1
    priority: P1
    note: 份额首次跌破 10%（9.9%）；2026H1 BBA 少赚近 120 亿元
  - id: E3
    name: 反方论据·消费升级论与统计局口径差异
    group: E
    origin: step1
    priority: P0
    note: 【必须正面回应】王侠（贸促会汽车分会）主张均价回升 3%、高端化体现消费升级。需检视其口径与数据基础
  - id: E4
    name: 反方论据·政策透支论（最强竞争性解释）
    group: E
    origin: step2
    priority: P0
    note: 【最高优先反方】承认销量下滑但归因于政策周期（约 300 万辆刺激消失）而非收入分化。此论点不否认下滑，只否认归因——必须正面回应
  - id: E5
    name: 反方论据·出口对冲完整量化（含口径冲突）
    group: E
    origin: step2
    priority: P0
    note: 2026H1 出口 509.6 万辆/+65.3%（中汽协口径）vs 乘用车出口 428.4 万/+251.1%（乘联口径）——两口径差 81 万辆，须标注。王侠称"出口增量弥补不了国内缺口"
  - id: E6
    name: 跨国参照·韩国微型车消亡（正例）+ 日本微车崛起（反例）
    group: E
    origin: step1+step2
    priority: P1
    note: 【机制辨析】韩国：<1000cc 城市车 1998 年占 27.6%→2025 预测 <8%（与中国同构，作主参照）；日本：1990s 微型车份额 8.9%→30%（与中国方向相反，作反例并说明机制差异）。中国是"微型车本身被消灭"，不同于日本"降级换微车"
  - id: E7
    name: 分价格带的置换参与与汽车金融渗透分布
    group: E
    origin: deep阶段增补
    priority: P0
    note: 【补齐 E4 最大缺口】用于把"透支=节奏问题"与"能力退出=水平问题"从间接推理升级为直接证据。判别逻辑：若为透支，底部应表现为"高置换参与 + 高金融杠杆"；实测相反（置换成交均价向 20-50 万集中、金融渗透 5-10 万约 48% 为各档最低）→ 底部是"参与资格退出"（被门槛排除），非"被动员后回落"。另：全市场换购率约 55%-70%，中国无公开"分价格带置换参与率"口径，redline 禁止编造

# 执行配置
execution:
  batch_size: 5           # 并行 agent 数量（Q4B）
  items_per_agent: 4      # 每个 agent 调研项数（Q4B）
  output_dir: ./results
  total_items: 32        # 原 30 项 + deep 阶段增补 E7（分价格带置换/金融分布）
  estimated_rounds: 2     # 按 batch_size=5 分 2 轮；实际执行 5 代理并发 + 增量派单
  model_note: 使用 web-search-agent，须先加载 chinese-tech + general-web 模块

# 写作方法论提醒（来自 Step 2 搜索代理）
writing_notes:
  - 2025 vs 2026 方向反转必须写清: 2025 是"低端扩容、高端萎缩"，2026 反转为"低端崩塌、高端韧性"。直接说"贫富分化导致低端萎缩"会与 2025 数据冲突，需解释为"2025 政策托底掩盖分化、2026 政策退坡后真实分化暴露"——这正是"先验指标vs后验指标"判据的完美案例
  - 最强反方是"政策透支论"而非"消费升级论": 消费升级论易反驳（BBA 下滑、二手车内循环），政策透支论承认下滑但否认收入分化归因，必须正面回应
  - 韩国比日本更有参照价值: 以韩国为主参照、日本为辅并说明机制差异
